{% extends "layout.html" %}
{% block content %}
    <div class="card">
        <h2 style="margin-top:0;">{% if slug %}Edit Article{% else %}New Article{% endif %}</h2>

        {% if errors %}
            <div class="error-list">
                {% for err in errors %}
                    <div>{{ err }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form action="{% if slug %}/article/{{ slug }}/edit{% else %}/article/new{% endif %}" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input id="title" name="title" type="text" value="{{ form.title or '' }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input id="description" name="description" type="text" value="{{ form.description or '' }}" required>
            </div>
            <div class="form-group">
                <label for="body">Body</label>
                <textarea id="body" name="body" required>{{ form.body or '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="tags">Tags (comma separated)</label>
                {% set tag_value = form.tagList|join(', ') if form.tagList else '' %}
                <input id="tags" name="tags" type="text" value="{{ tag_value }}">
            </div>
            <div class="form-actions">
                <button class="button" type="submit">{% if slug %}Update{% else %}Publish{% endif %}</button>
                <a href="/" class="ghost">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
